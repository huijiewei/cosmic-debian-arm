
name: Update COSMIC APT Repository

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  upload-artifacts:
    name: Build and deploy APT repository
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      REPO_NAME: cosmic-debian
      CODENAME: forky
      COMPONENTS: main
      DEPENDS_TAG: depends-20261023
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download COSMIC release packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p packages
          gh release download \
            --pattern '*.deb' \
            --dir packages

          count=$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l)
          echo "Found $count COSMIC packages"

          if [ "$count" -ne 30 ]; then
            echo "::error::Expected 30 COSMIC packages, found $count"
            exit 1
          fi

          filename=$(find packages -maxdepth 1 -type f \
            -name 'cosmic-session_*_arm64.deb' -print -quit)

          if [ -z "$filename" ]; then
            echo "::error::cosmic-session ARM64 package not found"
            exit 1
          fi

          release=$(basename "$filename" |
            sed -E 's/^cosmic-session_([^_]+)_arm64\.deb$/\1/')

          echo "COSMIC release version: $release"
          echo "version=$release" >> "$GITHUB_OUTPUT"
        id: check-artifacts

      - name: Download COSMIC dependency packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p depends

          gh release download "$DEPENDS_TAG" \
            --pattern '*.deb' \
            --dir depends

          count=$(find depends -maxdepth 1 -type f -name '*.deb' | wc -l)

          if [ "$count" -ne 7 ]; then
            echo "::error::Expected 7 dependency packages, found $count"
            exit 1
          fi

      - name: Prepare repository files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cp -v packages/*.deb artifacts/
          cp -v depends/*.deb artifacts/

          # This public key must correspond to SIGNING_KEY.
          test -s gpg.key
          cp gpg.key artifacts/gpg.key

      - name: Create APT repository
        id: create-apt-repo
        uses: morph027/apt-repo-action@b6b977523e6a5e235075787489bb073c60b71eb4
        with:
          repo-name: ${{ env.REPO_NAME }}
          scan-dir: artifacts
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-key-passphrase: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
          codename: ${{ env.CODENAME }}
          suite: testing
          components: ${{ env.COMPONENTS }}
          architectures: arm64
          origin: Debian APT Repository for COSMIC DE

      - name: Deploy APT repository to server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.APT_SERVER_HOST }}
          SERVER_USER: ${{ secrets.APT_SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.APT_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.APT_SERVER_KNOWN_HOSTS }}
          REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
        run: |
          set -euo pipefail

          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -d "$REPO_DIR"

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Verify SSH connectivity before deploying.
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'test -w /home/websites/apt/'

          # The destination directory is dedicated to this APT repository.
          rsync -av --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes" \
            "$REPO_DIR/" \
            "$SERVER_USER@$SERVER_HOST:/home/websites/apt/"

          echo "APT repository deployed successfully."
